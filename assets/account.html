<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My account · IELTS Masterclass</title><link rel="stylesheet" href="/ui.css"></head><body><header class="bar"><a class="brand" href="/">✦ IELTS &amp; Academic Writing<small>Masterclass members</small></a><nav><a href="/">Masterclass</a><a href="/admin">Admin</a></nav></header><main><div class="narrow card"><div class="eyebrow">My account</div><h1 id="name">Your membership</h1><p id="details">Loading account details…</p><p id="date"></p><div class="row"><a class="button" href="/">Open masterclass</a><button type="button" id="logout" class="secondary">Sign out</button></div><p class="note">Payments and renewals are handled outside this website by the masterclass owner.</p></div></main><script>
fetch('/api/me',{cache:'no-store'}).then(async r=>{if(!r.ok){location.href='/login';return}const u=await r.json();document.getElementById('name').textContent='Hello, '+u.name+'.';document.getElementById('details').textContent=u.email+' · '+u.role+(u.school_name?' · '+u.school_name:'');document.getElementById('date').textContent=u.role==='owner'?'Owner access':('Paid through '+u.paid_until+' (Algeria time) · '+(u.active?'Active':'Paused or expired'));}).catch(()=>{document.getElementById('details').textContent='Unable to load account details.'});
document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});location.href='/login'};
</script></body></html>
